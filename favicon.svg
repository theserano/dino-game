<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#111111"/>

  <!-- Dino body (light gray) -->
  <rect x="7" y="8" width="12" height="16" fill="#e8e8e8"/>
  <!-- Dino head -->
  <rect x="17" y="4" width="9" height="12" fill="#e8e8e8"/>
  <!-- Dino left arm -->
  <rect x="4" y="10" width="3" height="7" fill="#e8e8e8"/>
  <!-- Dino snout -->
  <rect x="24" y="8" width="4" height="6" fill="#e8e8e8"/>

  <!-- Eye socket (black) -->
  <rect x="21" y="6" width="5" height="5" fill="#111111"/>
  <!-- Eye white -->
  <rect x="22" y="7" width="3" height="3" fill="#e8e8e8"/>
  <!-- Pupil -->
  <rect x="24" y="8" width="2" height="2" fill="#111111"/>

  <!-- Legs -->
  <rect x="9"  y="24" width="3" height="6" fill="#e8e8e8"/>
  <rect x="14" y="24" width="3" height="4" fill="#e8e8e8"/>

  <!-- Blue wing accent (flying mode) -->
  <rect x="2"  y="14" width="7" height="3" fill="#8888ff"/>
  <rect x="21" y="14" width="7" height="3" fill="#8888ff"/>
</svg>
