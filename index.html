<body>
  <h1>DINO RUNNER</h1>

  <div id="gameWrap">
    <div id="scoreBoard">
      <span id="hiScore">HI 00000</span>
      <span id="flyBadge">WINGS UNLOCKED</span>
      <span id="score">00000</span>
    </div>
    <div style="position:relative">
      <canvas id="c" height="160"></canvas>
      <div id="gameOver">
        <h2>GAME OVER</h2>
        <p id="goRestart">PRESS JUMP KEY TO RESTART</p>
      </div>
      <div id="unlockBanner"><span>WINGS UNLOCKED! HOLD JUMP TO FLY</span></div>
    </div>
    <div id="message">PRESS JUMP KEY OR TAP TO START</div>
  </div>

  <div style="max-width:820px;width:100%;padding:0 1rem">
    <div id="controls">
      <div class="ctitle">KEY BINDINGS</div>
      <div class="bindRow">
        <span class="bindLabel">JUMP / FLY</span>
        <button class="bindBtn" id="btn-jump" onclick="startListen('jump')">SPACE</button>
      </div>
      <div class="bindRow">
        <span class="bindLabel">DUCK</span>
        <button class="bindBtn" id="btn-duck" onclick="startListen('duck')">ARROW DOWN</button>
      </div>
      <div id="conflictMsg"></div>
      <button id="resetBinds" onclick="resetBinds()">RESET TO DEFAULT</button>
    </div>
  </div>

  <div id="footer">REACH 300 TO UNLOCK FLIGHT</div>

  <script>
    const c   = document.getElementById('c');
    const ctx = c.getContext('2d');
    const W = 800, H = 160, GROUND = 130;
    const UNLOCK_SCORE = 300;
    c.width = W; c.height = H;

    /* ── Key bindings ─────────────────────────────────── */
    let binds = { jump: { code:'Space', label:'SPACE' }, duck: { code:'ArrowDown', label:'ARROW DOWN' } };
    let listening = null;

    function keyLabel(code) {
      const map = { Space:'SPACE',ArrowUp:'UP',ArrowDown:'DOWN',ArrowLeft:'LEFT',ArrowRight:'RIGHT',
        Enter:'ENTER',ShiftLeft:'L.SHIFT',ShiftRight:'R.SHIFT',ControlLeft:'L.CTRL',
        ControlRight:'R.CTRL',AltLeft:'L.ALT',AltRight:'R.ALT',Tab:'TAB',
        CapsLock:'CAPS',Backspace:'BKSP',Escape:'ESC' };
      if (map[code]) return map[code];
      if (code.startsWith('Key'))   return code.slice(3);
      if (code.startsWith('Digit')) return code.slice(5);
      return code.slice(0, 8);
    }

    function startListen(action) {
      listening = action;
      document.getElementById('btn-' + action).classList.add('listening');
      document.getElementById('btn-' + action).textContent = 'PRESS KEY...';
      document.getElementById('conflictMsg').textContent = '';
    }

    function stopListen() {
      if (!listening) return;
      const btn = document.getElementById('btn-' + listening);
      btn.classList.remove('listening');
      btn.textContent = binds[listening].label;
      listening = null;
    }

    function resetBinds() {
      binds = { jump: { code:'Space', label:'SPACE' }, duck: { code:'ArrowDown', label:'ARROW DOWN' } };
      document.getElementById('btn-jump').textContent = 'SPACE';
      document.getElementById('btn-duck').textContent = 'ARROW DOWN';
      document.getElementById('btn-jump').classList.remove('conflict');
      document.getElementById('btn-duck').classList.remove('conflict');
      document.getElementById('conflictMsg').textContent = '';
      stopListen();
    }

    function updateGoText() {
      document.getElementById('goRestart').textContent = 'PRESS ' + binds.jump.label + ' TO RESTART';
    }

    /* ── Game state ───────────────────────────────────── */
    let state = 'idle', score = 0, hiScore = 0, frame = 0, speed = 5;
    let spawnTimer = 0, spawnInterval = 90;
    let obstacles = [], clouds = [], particles = [];
    let flyUnlocked = false, flyActive = false, unlockBannerTimer = 0;
    let jumpHeld = false, duckHeld = false;

    const dino = { x:80, y:GROUND, w:44, h:52, vy:0, jumping:false, dead:false, legTimer:0, ducking:false };

    function reset() {
      Object.assign(dino, { y:GROUND, vy:0, jumping:false, dead:false, ducking:false });
      obstacles = []; clouds = []; particles = [];
      score = 0; frame = 0; speed = 5; spawnTimer = 0; spawnInterval = 90;
      flyUnlocked = false; flyActive = false; unlockBannerTimer = 0;
      jumpHeld = false; duckHeld = false;
      document.getElementById('gameOver').style.display    = 'none';
      document.getElementById('unlockBanner').style.display = 'none';
      document.getElementById('flyBadge').style.display    = 'none';
      document.getElementById('message').textContent       = '';
      updateGoText();
    }

    function jump() {
      if (!dino.jumping && !dino.dead && !flyUnlocked) { dino.vy = -14; dino.jumping = true; }
    }

    /* ── Particles ────────────────────────────────────── */
    function spawnParticles(x, y, color, n) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3;
        particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life:30, maxLife:30, color });
      }
    }

    /* ── Draw helpers ─────────────────────────────────── */
    function drawDino(d) {
      const flying = flyUnlocked && !d.dead;
      if (flying) {
        const wf = Math.sin(frame * 0.45) * 12;
        ctx.fillStyle = '#8888ff';
        ctx.fillRect(d.x - 8,  d.y + 16 + wf, 28, 10);
        ctx.fillRect(d.x + 24, d.y + 16 - wf, 28, 10);
        ctx.fillStyle = '#ddddff';
        ctx.fillRect(d.x - 4,  d.y + 18 + wf, 22, 6);
        ctx.fillRect(d.x + 26, d.y + 18 - wf, 22, 6);
      }
      ctx.fillStyle = d.dead ? '#cc4444' : flying ? '#ccccff' : '#e8e8e8';
      if (d.ducking) {
        ctx.fillRect(d.x, d.y+20, 48, 28);
        ctx.fillStyle = '#111'; ctx.fillRect(d.x+32, d.y+22, 10, 10);
        ctx.fillStyle = flying ? '#ccccff' : '#e8e8e8';
        ctx.fillRect(d.x+36, d.y+24, 4, 4); ctx.fillStyle='#111'; ctx.fillRect(d.x+40, d.y+24, 4, 4);
        ctx.fillStyle = flying ? '#ccccff' : '#e8e8e8';
        ctx.fillRect(d.x+8, d.y+48, 9, 10); ctx.fillRect(d.x+20, d.y+48, 9, 10); return;
      }
      ctx.fillRect(d.x+6, d.y, 36, 48); ctx.fillRect(d.x, d.y+6, 6, 20); ctx.fillRect(d.x+42, d.y, 10, 16);
      ctx.fillStyle = '#111'; ctx.fillRect(d.x+38, d.y+4, 8, 8);
      ctx.fillStyle = flying ? '#aaaaff' : '#e8e8e8'; ctx.fillRect(d.x+40, d.y+5, 4, 4);
      ctx.fillStyle = '#111'; ctx.fillRect(d.x+43, d.y+6, 3, 3);
      ctx.fillStyle = d.dead ? '#cc4444' : flying ? '#ccccff' : '#e8e8e8';
      if (d.jumping || d.dead) {
        ctx.fillRect(d.x+10, d.y+48, 6, 16); ctx.fillRect(d.x+26, d.y+48, 6, 10);
      } else {
        const alt = d.legTimer < 8;
        ctx.fillRect(d.x+10, d.y+48, 6, alt ? 18 : 10); ctx.fillRect(d.x+26, d.y+48, 6, alt ? 10 : 18);
      }
      if (flying && !d.dead) { spawnParticles(d.x+6, d.y+30, '#6666cc', 1); spawnParticles(d.x+6, d.y+40, '#4444aa', 1); }
      if (d.dead) { ctx.fillStyle='#cc4444'; ctx.fillRect(d.x+34, d.y+2, 4, 4); ctx.fillRect(d.x+30, d.y+6, 4, 4); }
    }

    function drawCactus(ob) {
      ctx.fillStyle = '#5a9e5a';
      ctx.fillRect(ob.x + ob.w/2 - 4, ob.y - ob.h, 8, ob.h);
      if (ob.type === 1) {
        ctx.fillRect(ob.x, ob.y - ob.h*0.6, ob.w, 8);
        ctx.fillRect(ob.x, ob.y - ob.h*0.6 - 16, 8, 16);
        ctx.fillRect(ob.x + ob.w - 8, ob.y - ob.h*0.6 - 12, 8, 12);
      } else if (ob.type === 2) {
        [{dx:-20,dy:-0.7},{dx:20,dy:-0.5}].forEach(s => {
          ctx.fillRect(ob.x + ob.w/2 - 4 + s.dx, ob.y - ob.h*s.dy, 6, ob.h*0.45);
          ctx.fillRect(ob.x + ob.w/2 - 4 + s.dx - (s.dx>0?0:6), ob.y - ob.h*(s.dy+0.15), 12, 6);
        });
      }
    }

    function drawPterodactyl(ob) {
      ctx.fillStyle = '#aaaaee';
      const flap = ob.flapTimer < 12;
      ctx.fillRect(ob.x+16, ob.y, 20, 14); ctx.fillRect(ob.x+30, ob.y-4, 12, 8);
      ctx.fillStyle = '#111'; ctx.fillRect(ob.x+38, ob.y-2, 4, 4); ctx.fillStyle = '#aaaaee';
      if (flap) { ctx.fillRect(ob.x, ob.y-12, 18, 10); ctx.fillRect(ob.x+34, ob.y-12, 18, 10); }
      else       { ctx.fillRect(ob.x, ob.y+4,  18, 10); ctx.fillRect(ob.x+34, ob.y+4,  18, 10); }
      ctx.fillRect(ob.x+8, ob.y+10, 10, 8);
    }

    function drawGround() {
      ctx.fillStyle = '#444'; ctx.fillRect(0, GROUND+52, W, 2);
      for (let i = 0; i < 20; i++) {
        const x = (i*60 + frame*speed*0.3) % W;
        ctx.fillStyle = '#333';
        ctx.fillRect(x, GROUND+53, 20 + Math.sin(i)*10, 1);
        ctx.fillRect(x+5, GROUND+56, 10, 1);
      }
    }

    function drawCloud(cl) {
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(cl.x, cl.y, 60, 16); ctx.fillRect(cl.x+10, cl.y-10, 40, 12); ctx.fillRect(cl.x+18, cl.y-18, 24, 10);
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;
    }

    function drawFlyMeter() {
      if (!flyUnlocked) return;
      const bx = W-90, by = H-18;
      ctx.fillStyle = '#1a1a3a'; ctx.fillRect(bx, by, 80, 6);
      const r = Math.min(1, Math.max(0, (GROUND - dino.y) / (GROUND - 10)));
      ctx.fillStyle = flyActive ? '#6666ff' : '#4444aa'; ctx.fillRect(bx, by, 80*r, 6);
      ctx.strokeStyle = '#4444aa'; ctx.lineWidth = 1; ctx.strokeRect(bx, by, 80, 6);
    }

    /* ── Collision ────────────────────────────────────── */
    function collides(a, b) {
      const p = 10;
      return !(a.x+p > b.x+b.w-p || a.x+a.w-p < b.x+p || a.y+p > b.y+b.h || a.y+a.h-p < b.y);
    }
    function getDinoBox() {
      if (dino.ducking) return { x:dino.x, y:dino.y+20, w:48, h:38 };
      return { x:dino.x, y:dino.y, w:44, h:68 };
    }

    /* ── Spawn ────────────────────────────────────────── */
    function spawnObstacle() {
      if (Math.random() < 0.25 && speed > 8) {
        obstacles.push({ x:W, y:GROUND-30+Math.random()*40, w:52, h:32, type:'ptero', flapTimer:0 });
      } else {
        const t = Math.floor(Math.random()*3), h = 40 + Math.random()*30;
        obstacles.push({ x:W, y:GROUND+52, w:t===2?70:40, h, type:t });
      }
    }

    function formatScore(n) { return String(Math.floor(n)).padStart(5, '0'); }

    /* ── Update ───────────────────────────────────────── */
    function update() {
      if (state !== 'running') return;
      frame++; score += 0.1;
      speed = 5 + Math.floor(score/100) * 0.4;
      spawnInterval = Math.max(45, 90 - Math.floor(score/50) * 5);

      if (!flyUnlocked && score >= UNLOCK_SCORE) {
        flyUnlocked = true; unlockBannerTimer = 180;
        document.getElementById('unlockBanner').style.display = 'block';
        document.getElementById('flyBadge').style.display     = 'inline-block';
        spawnParticles(dino.x+22, dino.y+24, '#8888ff', 30);
        spawnParticles(dino.x+22, dino.y+24, '#ccccff', 20);
      }
      if (unlockBannerTimer > 0) { unlockBannerTimer--; if (!unlockBannerTimer) document.getElementById('unlockBanner').style.display = 'none'; }

      dino.legTimer = (dino.legTimer + 1) % 16;
      dino.ducking  = duckHeld;

      if (flyUnlocked) {
        flyActive = jumpHeld;
        dino.vy  += flyActive ? (dino.vy > -5 ? -1.2 : 0) : 0.7;
        if (!flyActive) dino.vy += 0.7;
        dino.vy = Math.min(Math.max(dino.vy, -6), 8);
      } else { dino.vy += 0.7; }

      dino.y += dino.vy;
      if (dino.y >= GROUND) { dino.y = GROUND; dino.vy = 0; dino.jumping = false; }
      if (dino.y < 10)      { dino.y = 10; dino.vy = 0; }

      spawnTimer++;
      if (spawnTimer > spawnInterval) { spawnTimer = 0; spawnObstacle(); }
      if (frame % 120 === 0) clouds.push({ x:W, y:20+Math.random()*50, spd:0.8+Math.random()*0.5 });

      clouds.forEach(cl => cl.x -= cl.spd);
      clouds    = clouds.filter(cl => cl.x > -80);
      obstacles.forEach(ob => { ob.x -= speed; if (ob.type==='ptero') ob.flapTimer = (ob.flapTimer+1)%24; });
      obstacles = obstacles.filter(ob => ob.x > -100);
      particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
      particles = particles.filter(p => p.life > 0);

      const db = getDinoBox();
      for (const ob of obstacles) {
        const obBox = ob.type === 'ptero'
          ? { x:ob.x, y:ob.y, w:ob.w, h:ob.h }
          : { x:ob.x, y:ob.y-ob.h, w:ob.w, h:ob.h };
        if (collides(db, obBox)) {
          state = 'dead'; dino.dead = true;
          if (score > hiScore) hiScore = score;
          document.getElementById('gameOver').style.display = 'block';
          document.getElementById('unlockBanner').style.display = 'none';
          return;
        }
      }
    }

    /* ── Draw ─────────────────────────────────────────── */
    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#111';
      if (flyUnlocked && dino.y < GROUND - 20) {
        const t = (GROUND - dino.y) / (GROUND - 10);
        ctx.fillStyle = `rgb(${Math.floor(17+t*10)},${Math.floor(17+t*10)},${Math.floor(17+t*40)})`;
      }
      ctx.fillRect(0, 0, W, H);
      clouds.forEach(drawCloud);
      drawGround(); drawParticles();
      obstacles.forEach(ob => ob.type === 'ptero' ? drawPterodactyl(ob) : drawCactus(ob));
      drawDino(dino); drawFlyMeter();

      if (!flyUnlocked && score > 0) {
        const pct = Math.min(1, score / UNLOCK_SCORE);
        ctx.fillStyle = '#1a1a1a'; ctx.fillRect(W/2-60, H-14, 120, 6);
        ctx.fillStyle = `hsl(${240+pct*60},70%,60%)`; ctx.fillRect(W/2-60, H-14, 120*pct, 6);
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.strokeRect(W/2-60, H-14, 120, 6);
        ctx.fillStyle = '#555'; ctx.font = '7px "Press Start 2P"'; ctx.textAlign = 'center';
        ctx.fillText('FLY AT ' + formatScore(UNLOCK_SCORE), W/2, H-18);
      }

      document.getElementById('score').textContent   = formatScore(score);
      document.getElementById('hiScore').textContent = 'HI ' + formatScore(hiScore);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }

    /* ── Input ────────────────────────────────────────── */
    function handleStart() {
      if (state === 'idle' || state === 'dead') { reset(); state = 'running'; }
    }

    document.addEventListener('keydown', e => {
      if (listening) {
        e.preventDefault();
        if (['F5','F12','F11','Tab'].includes(e.key)) return;
        const other = listening === 'jump' ? 'duck' : 'jump';
        if (binds[other].code === e.code) {
          const btn = document.getElementById('btn-' + listening);
          btn.classList.add('conflict');
          document.getElementById('conflictMsg').textContent = 'KEY ALREADY USED FOR ' + (other==='jump'?'JUMP':'DUCK') + '!';
          btn.textContent = binds[listening].label;
          setTimeout(() => { btn.classList.remove('conflict'); document.getElementById('conflictMsg').textContent=''; listening=null; }, 1200);
          return;
        }
        binds[listening] = { code: e.code, label: keyLabel(e.code) };
        stopListen(); updateGoText(); return;
      }
      if (e.code === binds.jump.code) {
        e.preventDefault();
        if (state !== 'running') { handleStart(); return; }
        jumpHeld = true;
        if (!flyUnlocked) jump();
      }
      if (e.code === binds.duck.code) { e.preventDefault(); duckHeld = true; }
    });

    document.addEventListener('keyup', e => {
      if (e.code === binds.jump.code) jumpHeld = false;
      if (e.code === binds.duck.code) duckHeld = false;
    });

    c.addEventListener('click', () => { if (state !== 'running') handleStart(); else if (!flyUnlocked) jump(); });
    c.addEventListener('touchstart', e => { e.preventDefault(); jumpHeld=true; if (state!=='running') handleStart(); else if(!flyUnlocked) jump(); }, { passive:false });
    c.addEventListener('touchend',   e => { e.preventDefault(); jumpHeld=false; }, { passive:false });

    loop();
  </script>
</body>
</html>
